[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
dynamic = ["version"]
description = "TradingAgents: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.6.5",
    "langchain-anthropic>=1.7.4",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "markdown-it-py>=4.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "stockstats>=0.6.5",
    "typing-extensions>=4.14.0",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
factors = ["numpy>=1.26", "pyarrow>=15.0", "TA-Lib>=0.6"]
quant = [
    "numpy>=1.26",
    "pyarrow>=15.0",
    "websockets>=12.0",
]
dev = [
    "ruff>=0.16",
    "pytest>=8.0",
    "pytest-subtests>=0.13",
]
# Amazon Bedrock support (AWS SigV4 auth + boto3). Optional so the core install
# stays lean: pip install "tradingagents[bedrock]".
bedrock = [
    "langchain-aws>=1.7.9",
]

[project.scripts]
tradingagents = "cli.main:app"
tradingagents-quant = "tradingagents.research.quant.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "tradingagents.__version__"}

[tool.setuptools.packages.find]
include = ["tradingagents*", "cli*", "research_tools*", "factors*"]

[tool.setuptools.package-data]
factors = ["catalog.json", "origins.json"]
cli = ["static/*"]
tradingagents = ["assets/*.svg"]
"tradingagents.dataflows.research" = ["historical_capture_plan.md", "historical_funding_plan.md", "historical_panel_plan.md", "basis_oi_panel_plan.md", "basis_oi_prices_plan.md", "spot_archives_plan.md", "hedged_market_plan.md"]
"tradingagents.research.quant" = ["plans/*.md", "requirements-forward.txt"]
"tradingagents.research.equities" = ["plan.json", "protocol_v002.json", "sources_v002.json", "objectives.json", "external_plan.json", "stock_protocol.json", "depth_review_plan.json", "crypto_exposure_plan.json", "crypto_exposure_source_amendment.json", "requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not integration\""
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services; run only when asked for, with -m integration",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["results"]

[tool.ruff.lint]
# Standard "good defaults" rule set (pyflakes + pycodestyle + isort + bugbear +
# pyupgrade + comprehensions/simplify). Line length (E501) and layout are owned
# by the formatter; whole-repo `ruff format` adoption is deferred until the
# open-PR backlog clears, to avoid mass merge conflicts.
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]   # intentional re-exports

[tool.ruff.lint.isort]
# Keep multiple aliased names from one module in a single combined import block
# (e.g. the vendor imports in router.py) instead of one statement per name.
combine-as-imports = true
